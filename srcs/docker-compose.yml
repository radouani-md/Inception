services:
  nginx:
    build: requirements/nginx

    depends_on:
      - wordpress

    image: nginx:version

    ports:
      - "443:443"

    container_name: nginx

    restart: on-failure

    volumes:
      - wordpress-data:/var/www/html

    networks:
      - inception-network


  wordpress:
    build: requirements/wordpress
    
    container_name: wordpress

    image: wordpress:version

    restart: on-failure

    depends_on:
      - mariadb
    env_file:
      - .env

    volumes:
      - wordpress-data:/var/www/html

    networks:
      - inception-network
    

  mariadb:
    build: requirements/mariadb
    
    container_name: mariadb

    image: mariadb:version

    restart: on-failure

    volumes:
      - mariadb-data:/var/lib/mysql

    env_file:
      - .env
    
    networks:
      - inception-network


  portfolio:
    build: requirements/bonus/static_website
    
    container_name: portfolio

    image: portfolio:version

    ports:
      - 3344:3344

    restart: on-failure

  adminer:
    build: requirements/bonus/adminer
    
    container_name: adminer

    image: adminer:version

    networks:
      - inception-network

    restart: on-failure

    depends_on:
      - mariadb
  
  redis:
    build: requirements/bonus/redis
    
    container_name: redis

    image: redis:version

    networks:
      - inception-network

    restart: on-failure
  
  portainer:
    build: ./requirements/bonus/portainer

    container_name: portainer

    image: portainer:version

    restart: always

    ports:
      - "9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mradouan/data/portainer:/data

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mradouan/data/mariadb

  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mradouan/data/wordpress

networks:
  inception-network: