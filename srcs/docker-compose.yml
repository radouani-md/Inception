services:
  nginx:
    build:
      context: requirements/nginx
    depends_on:
      - wordpress

    ports:
      - "443:443"
    container_name: nginx

    restart: on-failure

    volumes:
      - wordpress-data:/var/www/html

    networks:
      - inception-network


  wordpress:
    build:
      context: requirements/wordpress
    
    container_name: wordpress

    restart: on-failure

    depends_on:
      - mariadb
    environment:
      
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: mariadb:3306

    volumes:
      - wordpress-data:/var/www/html

    networks:
      - inception-network
    

  mariadb:
    build: 
      context: requirements/mariadb
    
    container_name: mariadb

    restart: on-failure

    volumes:
      - mariadb-data:/var/lib/mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    
    networks:
      - inception-network



volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mradouan/data/mariadb

  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mradouan/data/wordpress

networks:
  inception-network: